---
name: Code Quality

on:
  "push":
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 isort mypy pylint
        pip install -r requirements.txt

    - name: Check code formatting with Black
      run: |
        black --diff src/ streamlit_app/ tests/
      continue-on-error: false

    - name: Check import sorting with isort
      run: |
        isort --check-only --diff src/ streamlit_app/ tests/
      continue-on-error: false

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/ streamlit_app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 src/ streamlit_app/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=150 --statistics
      continue-on-error: true

    - name: Lint with pylint
      run: |
        pylint src/ streamlit_app/ --max-line-length=150 --disable=C0114,C0115,C0116
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Check for known security vulnerabilities
      run: |
        safety check --json
      continue-on-error: true

    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json
        retention-days: 7

  code-quality-summary:
    needs: [lint, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check results
      run: |
        echo "Lint status: ${{ needs.lint.result }}"
        echo "Security status: ${{ needs.security.result }}"
        if [ "${{ needs.lint.result }}" == "success" ]; then
          echo "✅ Code quality checks passed!"
        else
          echo "⚠️  Code quality issues detected"
        fi
