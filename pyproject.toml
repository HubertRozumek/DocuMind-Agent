[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DocuMind-Agent"
version = "1.0"
description = "Intelligent RAG agent with self-correction, multi-layer grading, and external tool integration"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Hubert Rozumek", email = "hubert.rozumek9@gmail.com"}
]
keywords = [
    "rag",
    "llm",
    "document-qa",
    "langchain",
    "langgraph",
    "vector-search",
    "chromadb",
    "ollama"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "streamlit>=1.28.0,<2.0.0",
    "python-dotenv>=1.0.0",
    "langchain>=0.1.0,<0.2.0",
    "langchain-community>=0.0.10,<0.1.0",
    "langgraph>=0.0.20,<0.1.0",
    "langchain-core>=0.1.0,<0.2.0",
    "chromadb>=0.4.18,<0.5.0",
    "sentence-transformers>=2.2.2,<3.0.0",
    "torch>=2.0.0,<3.0.0",
    "transformers>=4.35.0,<5.0.0",
    "pymupdf>=1.23.0,<2.0.0",
    "pypdf>=3.17.0,<4.0.0",
    "reportlab>=4.0.0,<5.0.0",
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-dateutil>=2.8.0",
    "regex>=2023.0.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "black>=23.0.0,<24.0.0",
    "flake8>=6.1.0,<7.0.0",
    "isort>=5.12.0,<6.0.0",
    "mypy>=1.7.0,<2.0.0",
    "pre-commit>=3.5.0,<4.0.0",
    "pylint>=3.0.0,<4.0.0",
    "types-requests>=2.31.0",
    "types-python-dateutil>=2.8.0",
]

docs = [
    "mkdocs>=1.5.0,<2.0.0",
    "mkdocs-material>=9.4.0,<10.0.0",
    "mkdocstrings>=0.24.0,<1.0.0",
    "mkdocstrings-python>=1.7.0,<2.0.0",
]

all = [
    "documind-agent[dev,docs]",
]

[project.urls]
Homepage = "https://github.com/HubertRozumek/DocuMind-Agent"
Documentation = "https://github.com/HubertRozumek/DocuMind-Agent/blob/main/README.md"
Repository = "https://github.com/HubertRozumek/DocuMind-Agent"

[project.scripts]
documind = "streamlit_app.app:main"

# ============================================
# BLACK - Code Formatter
# ============================================
[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | models/cache
  | data/vector_store
)/
'''

# ============================================
# ISORT - Import Sorter
# ============================================
[tool.isort]
profile = "black"
line_length = 150
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["**/models/cache/*", "**/data/vector_store/*"]

# ============================================
# MYPY - Type Checker
# ============================================
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = false
warn_return_any = false
warn_unused_configs = false
warn_redundant_casts = false
warn_unused_ignores = false
warn_no_return = false
strict_optional = false


[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "sentence_transformers.*",
    "langchain.*",
    "langgraph.*",
    "streamlit.*",
    "reportlab.*",
    "pymupdf.*",
]
ignore_missing_imports = true

# ============================================
# PYTEST - Test Runner
# ============================================
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ============================================
# COVERAGE - Code Coverage
# ============================================
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/models/cache/*",
    "*/data/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# ============================================
# PYLINT - Linter
# ============================================
[tool.pylint.messages_control]
disable = [
    "C0103",  # Invalid name
    "C0114",  # Missing module docstring
    "C0115",  # Missing class docstring
    "C0116",  # Missing function docstring
    "R0903",  # Too few public methods
    "R0913",  # Too many arguments
    "W0212",  # Access to protected member
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "id", "q"]

# ============================================
# SETUPTOOLS - Package Configuration
# ============================================
[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "streamlit_app*"]
exclude = ["tests*", "data*", "models*"]
